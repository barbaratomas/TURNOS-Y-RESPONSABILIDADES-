<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12325C">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Turnos en casa</title>
<meta name="apple-mobile-web-app-title" content="Turnos">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1D4F91;--deep:#12325C;--ink:#1A2433;--muted:#5A6678;--line:#DCE3EC;--soft:#F3F6FA;--orange:#E8833A;--orange-d:#A84B0C;--orange-s:#FFF3E8;--ok:#1F8A5B;--ok-s:#E6F5EE;--no:#C2412D;--no-s:#FCECE9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--soft);font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--soft)}
header{background:var(--deep);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 18px;border-radius:0 0 22px 22px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hello{font-size:14px;color:#BFD0E8}
h1{font-family:Outfit,sans-serif;font-weight:700;font-size:26px;margin:2px 0 0;line-height:1.1;text-transform:capitalize}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid #2E5488;background:#1A4275;display:flex;align-items:center;justify-content:center}
.pts{display:flex;align-items:center;gap:8px;background:var(--orange);color:#1A2433;border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px}
.pts b{font-family:Outfit,sans-serif;font-size:20px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.day{border:1px solid #2E5488;background:transparent;color:#fff;border-radius:12px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
.day small{font-size:12px;color:#BFD0E8;font-weight:600}
.day span{font-family:Outfit,sans-serif;font-size:18px;font-weight:700}
.day i{width:6px;height:6px;border-radius:50%;background:transparent}
.day.sel{background:#fff;color:var(--deep);border-color:#fff}
.day.sel small{color:var(--navy)}
.day.today:not(.sel){border-color:var(--orange)}
.day i.full{background:#5FD39A}.day i.part{background:var(--orange)}
main{flex:1;padding:18px 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.sechead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
h2{font-family:Outfit,sans-serif;font-size:20px;margin:0;font-weight:700}
.tag{font-size:13px;font-weight:600;color:var(--muted)}
.task{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px;min-height:64px}
.task .ic{width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.task .tx{flex:1;display:flex;flex-direction:column;gap:2px}
.task .tx b{font-size:16px}
.task .tx em{font-style:normal;font-size:13px;color:var(--muted)}
.chk{width:34px;height:34px;border-radius:10px;border:2px solid #9AAFC9;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff}
.task.done{background:var(--ok-s);border-color:#A9DCC3}
.task.done .chk{background:var(--ok);border-color:var(--ok)}
.task.done .tx b{text-decoration:line-through;text-decoration-color:#7FBFA0}
.task.miss{background:var(--no-s);border-color:#F1C2B9}
.task.miss .chk{border-color:var(--no)}
.task[disabled]{opacity:.55;cursor:default}
.mom .task .ic{background:#E3EAF3}
.empty{font-size:15px;color:var(--muted);padding:6px 2px}
.progress{display:flex;align-items:center;gap:14px}
.bar{flex:1;height:10px;background:#E3EAF3;border-radius:999px;overflow:hidden}
.bar div{height:100%;background:var(--ok);border-radius:999px;transition:width .3s}
.banner{background:var(--ok);color:#fff;border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center;font-weight:600}
.note{font-size:14px;color:var(--muted);line-height:1.45}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted);border-radius:12px;min-height:52px}
nav button.on{color:var(--navy);background:#E8EFF8}
table{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed}
col.c0{width:78px}
th{font-size:12px;color:var(--muted);font-weight:700}
td.lbl{font-size:13px;font-weight:600;line-height:1.2;padding-right:2px}
.cell{width:100%;height:36px;padding:0;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.c-ok{background:var(--ok-s);border-color:#A9DCC3;color:var(--ok)}
.c-no{background:var(--no-s);border-color:#F1C2B9;color:var(--no)}
.c-pend{background:#fff;color:#8A96A8}
.c-off{background:var(--soft);color:#B3BDCB;border-style:dashed}
.c-mom{background:#E3EAF3;color:#33475F}
.c-yo{background:var(--navy);color:#fff;border-color:var(--navy)}
.c-both{background:var(--orange-s);color:var(--orange-d);border-color:#F3C9A1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-family:Outfit,sans-serif;font-size:28px;color:var(--navy)}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.wknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wknav button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff}
.reward{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-top:8px}
.rp{width:58px;flex-shrink:0;text-align:center;background:var(--navy);color:#fff;border-radius:10px;padding:6px 0}
.rp b{display:block;font-family:Outfit,sans-serif;font-size:20px;line-height:1.1}
.rp small{font-size:10px;font-weight:700;letter-spacing:.5px}
.reward .rn{flex:1;font-size:15px;font-weight:500;line-height:1.3}
.reward .rn small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;min-height:44px}
.btn-p{background:var(--orange);color:#1A2433}
.btn-s{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.btn-n{background:var(--navy);color:#fff}
.lock{opacity:.6}
ul.ag{margin:8px 0 0;padding-left:20px;font-size:15px;line-height:1.6}
.aghead{border-radius:12px;padding:10px 14px;font-family:Outfit,sans-serif;font-weight:700;font-size:17px}
.sig{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px;border-radius:12px;border:1px dashed #9AAFC9;width:100%;background:#fff;min-height:52px;text-align:left}
.sig.ok{border-style:solid;border-color:#A9DCC3;background:var(--ok-s)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input{font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:12px;min-height:46px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.modal{position:fixed;inset:0;background:rgba(18,50,92,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet .row{display:flex;gap:10px}.sheet .row .btn{flex:1}
.logo{display:block;width:170px;height:auto;margin:6px auto 0;opacity:.9}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:30;max-width:90%;text-align:center}
</style>
</head>

  <header id="hdr"></header>

</div>

  if(!S) S = JSON.parse(JSON.stringify(DEFAULT));
  for(const k in DEFAULT) if(S[k]===undefined) S[k]=JSON.parse(JSON.stringify(DEFAULT[k]));
}
let canSave=true;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); canSave=true; }catch(e){ canSave=false; } }
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
load();

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg = (n, sz, col, sw) => '<svg viewBox="0 0 24 24" width="'+(sz||22)+'" height="'+(sz||22)+'" fill="none" stroke="'+(col||'currentColor')+'" stroke-width="'+(sw||1.8)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[n]+'</svg>';
const pad = n => String(n).padStart(2,'0');
const keyOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const wd = d => (d.getDay()+6)%7;
const startOfDay = d => { const x=new Date(d); x.setHours(0,0,0,0); return x; };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const monday = d => addDays(startOfDay(d), -wd(d));
const TODAY = () => startOfDay(new Date());

let tab='hoy', sel=TODAY(), weekOff=0;

// Items for a person on a date. key without prefix = his; 'm:' prefix = mother's.
function itemsFor(who, date){
  const i = wd(date), out=[];
  for(const t in TASKS){
    const o = S.plan[t][i];
    if(o===who || o==='juntos'){
      out.push({id:t, key:(who==='madre' && o!=='juntos') ? 'm:'+t : t, icon:t, name:TASKS[t].name, sub:o==='juntos' ? 'Juntos · '+TASKS[t].sub : TASKS[t].sub, both:o==='juntos'});
    }
  }
  if(who==='yo') for(const r in RULES) if(S.rules[r][i]) out.push({id:r,key:r,icon:r,name:RULES[r].name,sub:RULES[r].sub,rule:true});
  return out;
}
const isDone = (date,key) => !!(S.done[keyOf(date)] && S.done[keyOf(date)][key]);
function toggle(date,key){
  const k=keyOf(date); S.done[k]=S.done[k]||{};
  if(S.done[k][key]) delete S.done[k][key]; else S.done[k][key]=true;
  save();
}
function weekStats(m){
  let total=0, done=0;
  for(let i=0;i<7;i++){ const d=addDays(m,i); itemsFor('yo',d).forEach(it=>{ total++; if(isDone(d,it.key)) done++; }); }
  const need=Math.max(1,Math.ceil(total*S.goal/100));
  return {total, done, need, ok: done>=need};
}
const weekOf = m => S.weeks[keyOf(m)] || null;
function dayState(date){
  const it=itemsFor('yo',date); if(!it.length) return '';
  const d=it.filter(x=>isDone(date,x.key)).length;
  return d===it.length ? 'full' : d>0 ? 'part' : '';
}

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
}
function confirmSheet(title, text, okLabel, onOk){
  const L=document.getElementById('layer');
  L.innerHTML='<div class="modal"><div class="sheet" role="dialog" aria-modal="true"><h2>'+esc(title)+'</h2><div class="note">'+text+'</div><div class="row"><button class="btn btn-s" id="no">Cancelar</button><button class="btn btn-p" id="yes">'+esc(okLabel)+'</button></div></div></div>';
  L.querySelector('#no').onclick=()=>L.innerHTML='';
  L.querySelector('.modal').onclick=e=>{ if(e.target.classList.contains('modal')) L.innerHTML=''; };
  L.querySelector('#yes').onclick=()=>{ L.innerHTML=''; onOk(); };
}

function header(){
  const h=document.getElementById('hdr');
  const today=TODAY();
  let title, sub;
  if(tab==='hoy'){
    const diff=Math.round((sel-today)/864e5);
    sub = diff===0 ? 'Hoy' : diff===-1 ? 'Ayer' : diff===1 ? 'Mañana' : (diff<0?'Día pasado':'Próximamente');
    title = DAYS_L[wd(sel)]+' '+sel.getDate();
  } else {
    sub = 'Hola, '+S.names.yo;
    title = {semana:'Mi semana', premios:'Mi premio', acuerdo:'Nuestro acuerdo', ajustes:'Ajustes'}[tab];
  }
  let html='<div class="toprow"><div><div class="hello">'+esc(sub)+'</div><h1>'+esc(title)+'</h1></div>'+
    '<div style="display:flex;gap:8px;align-items:center"><button class="pts" id="ptsBtn" aria-label="Ver mi premio">'+svg('premio',18,'#1A2433',2)+'<b>'+(()=>{const w=weekStats(monday(TODAY()));return w.done+'/'+w.need;})()+'</b></button>'+
    '<button class="iconbtn" id="cfg" aria-label="Ajustes">'+svg('ajustes',22,'#fff')+'</button></div></div>';
  if(tab==='hoy'){
    const m=monday(sel); html+='<div class="days">';
    for(let i=0;i<7;i++){
      const d=addDays(m,i), c=['day']; if(+d===+sel) c.push('sel'); if(+d===+today) c.push('today');
      html+='<button class="'+c.join(' ')+'" data-d="'+(+d)+'"><small>'+DAYS[i]+'</small><span>'+d.getDate()+'</span><i class="'+(d<=today?dayState(d):'')+'"></i></button>';
    }
    html+='</div>';
  }
  h.innerHTML=html;
  h.querySelector('#ptsBtn').onclick=()=>go('premios');
  h.querySelector('#cfg').onclick=()=>go('ajustes');
  h.querySelectorAll('.day').forEach(b=>b.onclick=()=>{ sel=new Date(+b.dataset.d); render(); });
}

function taskBtn(it, date, future, past){
  const done=isDone(date,it.key);
  const cls=['task']; if(done) cls.push('done'); else if(past) cls.push('miss');
  const status = done ? 'Hecho' : past ? 'No hecho' : future ? 'Más adelante' : 'Pendiente';
  return '<button class="'+cls.join(' ')+'" data-k="'+it.key+'" '+(future?'disabled':'')+' aria-pressed="'+done+'">'+
    '<span class="ic">'+svg(it.icon,24,'#1D4F91',1.7)+'</span>'+
    '<span class="tx"><b>'+esc(it.name)+'</b><em>'+esc(it.sub)+' · '+status+'</em></span>'+
    '<span class="chk">'+(done?svg('check',20,'#fff',3):'')+'</span></button>';
}

function viewHoy(){
  const today=TODAY(), future=sel>today, past=sel<today;
  const mine=itemsFor('yo',sel), mom=itemsFor('madre',sel);
  const d=mine.filter(x=>isDone(sel,x.key)).length;
  let h='';
  if(mine.length && d===mine.length) h+='<div class="banner">'+svg('star',26,'#fff',2)+'<span>¡Día completo! Un paso más hacia tu premio.</span></div>';
  h+='<section class="card"><div class="sechead"><h2>Me toca a mí</h2><span class="tag">'+d+' de '+mine.length+'</span></div>'+
     '<div class="progress"><div class="bar"><div style="width:'+(mine.length?Math.round(d/mine.length*100):0)+'%"></div></div><span class="tag">Cuentan para tu premio</span></div>';
  h+= mine.length ? mine.map(it=>taskBtn(it,sel,future,past)).join('') : '<div class="banner" style="background:#1D4F91">'+svg('star',26,'#fff',2)+'<span>Hoy es tu día libre. ¡Disfrútalo!</span></div>';
  h+='</section>';
  h+='<section class="card mom"><div class="sechead"><h2>Le toca a '+esc(S.names.madre)+'</h2><span class="tag">'+mom.filter(x=>isDone(sel,x.key)).length+' de '+mom.length+'</span></div>';
  h+= mom.length ? mom.map(it=>taskBtn(it,sel,future,past)).join('') : '<p class="empty">Hoy no tiene tareas.</p>';
  h+='</section>';
  if(future) h+='<p class="note" style="text-align:center">Solo puedes marcar las tareas de hoy o de días pasados.</p>';
  return h;
}

function viewSemana(){
  const today=TODAY(), m=addDays(monday(today), weekOff*7), end=addDays(m,6);
  const rows=[...Object.keys(TASKS), ...Object.keys(RULES)];
  let total=0, done=0, fullDays=0, h='';
  let tb='<table><colgroup><col class="c0"></colgroup><thead><tr><th></th>'+DAYS.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>';
  rows.forEach(r=>{
    const isRule=!!RULES[r];
    tb+='<tr><td class="lbl">'+(isRule?(r==='movil'?'Móvil 22:00':'Salida 7:30'):TASKS[r].name.replace('Hacer la cena','Cena'))+'</td>';
    for(let i=0;i<7;i++){
      const d=addDays(m,i); let cls='c-off', txt='';
      const owner = isRule ? (S.rules[r][i]?'yo':'nadie') : S.plan[r][i];
      if(owner==='madre'){ cls='c-mom'; txt=S.names.madre.charAt(0).toUpperCase(); }
      else if(owner==='yo'||owner==='juntos'){
        total++;
        if(isDone(d,r)){ cls='c-ok'; txt='✓'; done++; }
        else if(d<today){ cls='c-no'; txt='✗'; }
        else { cls='c-pend'; txt='·'; }
      }
      tb+='<td><div class="cell '+cls+'">'+esc(txt)+'</div></td>';
    }
    tb+='</tr>';
  });
  tb+='</tbody></table>';
  for(let i=0;i<7;i++){ const d=addDays(m,i); if(d<=today && dayState(d)==='full') fullDays++; }
  const label = weekOff===0 ? 'Esta semana' : weekOff===-1 ? 'Semana pasada' : m.getDate()+'/'+(m.getMonth()+1)+' – '+end.getDate()+'/'+(end.getMonth()+1);
  h+='<div class="wknav"><button id="wp" aria-label="Semana anterior">'+svg('left')+'</button><h2>'+label+'</h2><button id="wn" aria-label="Semana siguiente" '+(weekOff>=0?'disabled style="opacity:.4"':'')+'>'+svg('right')+'</button></div>';
  const ws=weekStats(m), wr=weekOf(m);
  h+='<div class="stats"><div class="stat"><b>'+done+'/'+total+'</b><span>Tareas hechas</span></div><div class="stat"><b>'+ws.need+'</b><span>Para el premio</span></div><div class="stat"><b>'+fullDays+'</b><span>Días completos</span></div></div>';
  h+='<section class="card" style="display:flex;gap:12px;align-items:center">'+svg('premio',26,ws.ok?'#1F8A5B':'#A84B0C')+'<div style="flex:1"><div class="tag">Premio de la semana</div><b style="font-size:16px">'+(wr&&wr.reward?esc(wr.reward):'Sin elegir')+'</b></div><span class="tag" style="color:'+(ws.ok?'#1F8A5B':'#5A6678')+'">'+(ws.ok?'Conseguido':(m<monday(today)?'No conseguido':'En juego'))+'</span></section>';
  h+='<section class="card" style="padding:10px 8px;overflow-x:auto">'+tb+
     '<div class="legend" style="padding:0 6px 4px"><span><i style="background:#E6F5EE;border:1px solid #A9DCC3"></i>Hecho</span><span><i style="background:#FCECE9;border:1px solid #F1C2B9"></i>No hecho</span><span><i style="background:#fff;border:1px solid #DCE3EC"></i>Pendiente</span><span><i style="background:#E3EAF3"></i>'+esc(S.names.madre)+'</span></div></section>';
  if(done===total && total>0) h+='<div class="banner">'+svg('star',26,'#fff',2)+'<span>¡Semana perfecta! Todo hecho.</span></div>';
  h+='<p class="note">El domingo, mirad juntos esta pantalla (10 minutos): qué ha ido bien y qué ha costado más.</p>';
  return h;
}

const IDEAS=['Elegir la película o serie','Móvil hasta las 23:00 el sábado','Elegir la cena del fin de semana','5 € para un juego o una app','Cena a domicilio','Volver más tarde el sábado','Plan con amigos','Comodín: cambiar un turno'];
function viewPremios(){
  const today=TODAY(), m=monday(today), ws=weekStats(m), w=weekOf(m);
  let h='';
  if(!w || !w.reward){
    h+='<section class="card"><h2>¿Qué premio quieres esta semana?</h2><p class="note" style="margin:6px 0 0">Lo eliges tú. Si llegas a <b>'+ws.need+' de '+ws.total+'</b> tareas antes del domingo, lo consigues.</p>'+
       '<div class="field"><label for="rw">Mi premio</label><input id="rw" maxlength="80" placeholder="Escribe tu premio"></div>'+
       '<div class="tag" style="margin-top:12px">Ideas (toca una si te gusta)</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">'+
       IDEAS.map(x=>'<button class="btn btn-s idea" style="min-height:40px;padding:8px 12px;font-weight:600">'+esc(x)+'</button>').join('')+'</div>'+
       '<button class="btn btn-p" id="pick" style="width:100%;margin-top:14px">Elegir este premio</button></section>';
  } else {
    const pct=Math.min(100,Math.round(ws.done/ws.need*100));
    h+='<section class="card" style="'+(ws.ok?'background:#E6F5EE;border-color:#A9DCC3':'')+'"><div class="tag">Mi premio de esta semana</div><h2 style="font-size:24px;margin:4px 0 12px">'+esc(w.reward)+'</h2>'+
       '<div class="progress"><div class="bar"><div style="width:'+pct+'%"></div></div><span class="tag"><b style="color:#1A2433">'+ws.done+'</b> de '+ws.need+'</span></div>'+
       '<p class="note" style="margin:10px 0 0">'+(ws.ok?'¡Conseguido! Enséñaselo a '+esc(S.names.madre)+'.':'Te faltan <b>'+(ws.need-ws.done)+'</b> tareas para conseguirlo.')+'</p>';
    if(ws.ok) h+= w.delivered ? '<div class="sig ok" style="margin-top:12px">'+svg('check',22,'#1F8A5B',2.5)+'<span><b>Premio entregado</b></span></div>' : '<button class="btn btn-n" id="deliv" style="width:100%;margin-top:12px">'+esc(S.names.madre)+': marcar como entregado</button>';
    else h+='<button class="btn btn-s" id="chg" style="width:100%;margin-top:12px">Cambiar mi premio</button>';
    h+='</section>';
  }
  const past=Object.keys(S.weeks).filter(k=>k<keyOf(m) && S.weeks[k].reward).sort().reverse();
  if(past.length){
    h+='<section class="card"><h2>Semanas anteriores</h2>';
    past.forEach(k=>{ const [y,mo,da]=k.split('-').map(Number), mm=new Date(y,mo-1,da), st=weekStats(mm);
      h+='<div class="reward"><span>'+svg(st.ok?'check':'left',22,st.ok?'#1F8A5B':'#C2412D',2.5)+'</span><div class="rn">'+esc(S.weeks[k].reward)+'<small>Semana del '+da+'/'+mo+' · '+st.done+' de '+st.need+' · '+(st.ok?'Conseguido':'No conseguido')+'</small></div></div>'; });
    h+='</section>';
  }
  h+='<p class="note">Cada lunes eliges un premio nuevo. Hablad del premio juntos para que sea posible.</p>';
  return h;
}

  const yo=S.names.yo, ma=S.names.madre;

  return '<p class="note" style="margin:0">En casa somos un equipo. Los dos nos comprometemos.</p>'+
  '<section class="card"><div class="aghead" style="background:#1D4F91;color:#fff">'+esc(yo==='Yo'?'Yo':yo)+' me comprometo a</div><ul class="ag">'+
  '<li>Hacer mis turnos de cena, fregar y tender.</li><li>Dejar el móvil en el comedor a las 22:00.</li><li>Salir de casa a las 7:30.</li><li>Marcar en la app lo que hago, sin trampas.</li><li>Avisar antes si un día no puedo.</li><li>Elegir cada lunes mi premio de la semana.</li></ul>'+sig('yo',yo)+'</section>'+
  '<section class="card"><div class="aghead" style="background:#E3EAF3;color:#1D4F91">'+esc(ma)+' se compromete a</div><ul class="ag">'+
  '<li>Hacer sus turnos de cena, fregar y tender.</li><li>Dejar que haga mis tareas a mi manera.</li><li>No hacer mis turnos por mí.</li><li>Darme el premio de la semana si lo consigo.</li><li>Reconocer lo que hago bien.</li></ul>'+sig('madre',ma)+'</section>'+
  '<section class="card" style="background:#FFF3E8;border-color:#F3C9A1"><h2 style="color:#A84B0C">Los dos</h2><ul class="ag" style="color:#6B3008"><li>El domingo revisamos la semana juntos.</li><li>Si alguien no puede un día, cambiamos el turno avisando.</li><li>El premio tiene que ser posible y lo hablamos juntos.</li></ul></section>'+
  '<img class="logo" src="'+LOGO+'" alt="ASINDOWN Formación">';
}

const OWN = ['yo','madre','juntos','nadie'];

  let h='<section class="card"><h2>Nombres</h2><div class="field"><label for="ny">Mi nombre</label><input id="ny" value="'+esc(S.names.yo)+'" maxlength="20"></div><div class="field"><label for="nm">La otra persona</label><input id="nm" value="'+esc(S.names.madre)+'" maxlength="20"></div></section>';
  h+='<section class="card" style="padding:12px 8px"><div style="padding:0 6px"><h2>Reparto de turnos</h2><p class="note" style="margin:4px 0 6px">Toca una casilla para cambiar quién lo hace: '+esc(S.names.yo)+' → '+esc(S.names.madre)+' → los 2 → nadie.</p></div><table><colgroup><col class="c0"></colgroup><thead><tr><th></th>'+DAYS.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>';
  for(const t in TASKS){

      const m={yo:['c-yo',S.names.yo.charAt(0).toUpperCase()],madre:['c-mom',S.names.madre.charAt(0).toUpperCase()],juntos:['c-both','2'],nadie:['c-off','—']}[o];
      h+='<td><button class="cell '+m[0]+'" data-p="'+t+'|'+i+'" aria-label="'+TASKS[t].name+' '+DAYS_L[i]+': '+o+'">'+esc(m[1])+'</button></td>';

  }
  for(const r in RULES){

    h+='</tr>';
  }
  h+='</tbody></table></section>';
  h+='<section class="card"><h2>Objetivo semanal</h2><p class="note" style="margin:4px 0 8px">Parte de sus tareas que tiene que hacer para conseguir el premio.</p><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">'+
     [70,80,90,100].map(g=>'<button class="btn '+(S.goal===g?'btn-n':'btn-s')+'" data-g="'+g+'">'+g+' %</button>').join('')+'</div><p class="note" style="margin:8px 0 0">Esta semana: '+weekStats(monday(TODAY())).need+' de '+weekStats(monday(TODAY())).total+' tareas.</p></section>';
  h+='<section class="card"><h2>Copia de seguridad</h2><p class="note" style="margin:4px 0 8px">Todo se guarda solo en este móvil. Si cambias de móvil o borras el navegador, copia antes este código y pégalo después.</p>'+
     '<button class="btn btn-n" id="bk" style="width:100%">Copiar mi código</button><div class="field"><label for="rs">Recuperar: pega aquí tu código</label><input id="rs" placeholder="Pega el código"></div><button class="btn btn-s" id="rsb" style="width:100%;margin-top:8px">Recuperar datos</button></section>';
  h+='<section class="card"><h2>Empezar de cero</h2><p class="note">Borra las tareas marcadas y los premios. El reparto se queda igual.</p><button class="btn btn-s" id="reset" style="width:100%;color:#C2412D">Borrar historial</button></section>';
  h+='<p class="note" style="text-align:center">'+(canSave?'Guardado automáticamente en este móvil.':'Este navegador no deja guardar. Ábrelo en Chrome o Safari normal.')+'</p><img class="logo" src="'+LOGO+'" alt="ASINDOWN Formación">';
  return h;

function navBar(){
  const items=[['hoy','Hoy'],['semana','Semana'],['premios','Mi premio'],['acuerdo','Acuerdo']];
  const n=document.getElementById('nav');
  n.innerHTML=items.map(([k,l])=>'<button class="'+(tab===k?'on':'')+'" data-t="'+k+'">'+svg(k==='premios'?'premio':k,24)+l+'</button>').join('');
  n.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.t));
}
function go(t){ tab=t; if(t==='hoy') sel=TODAY(); if(t==='semana') weekOff=0; render(); window.scrollTo(0,0); }

function render(){
  header(); navBar();
  const M=document.getElementById('main');
  M.innerHTML = {hoy:viewHoy, semana:viewSemana, premios:viewPremios, acuerdo:viewAcuerdo, ajustes:viewAjustes}[tab]();
  M.querySelectorAll('.task[data-k]').forEach(b=>b.onclick=()=>{
    if(b.disabled) return;
    const k=b.dataset.k, was=isDone(sel,k); toggle(sel,k);
    if(!was && k.indexOf('m:')!==0) toast('¡Hecho! Un paso más hacia tu premio');
    render();
  });
  const wp=M.querySelector('#wp'), wn=M.querySelector('#wn');
  if(wp) wp.onclick=()=>{ weekOff--; render(); };
  if(wn) wn.onclick=()=>{ if(weekOff<0){ weekOff++; render(); } };
  const rw=M.querySelector('#rw');
  M.querySelectorAll('.idea').forEach(b=>b.onclick=()=>{ rw.value=b.textContent; rw.focus(); });
  const pick=M.querySelector('#pick');
  if(pick) pick.onclick=()=>{ const v=rw.value.trim(); if(!v){ toast('Escribe tu premio primero'); return; } S.weeks[keyOf(monday(TODAY()))]={reward:v,delivered:false}; save(); render(); toast('¡Premio elegido! A por él'); };
  const chg=M.querySelector('#chg'); if(chg) chg.onclick=()=>{ delete S.weeks[keyOf(monday(TODAY()))]; save(); render(); };
  const dv=M.querySelector('#deliv'); if(dv) dv.onclick=()=>{ S.weeks[keyOf(monday(TODAY()))].delivered=true; save(); render(); toast('¡Disfrútalo!'); };
  M.querySelectorAll('[data-sig]').forEach(b=>b.onclick=()=>{
    const w=b.dataset.sig;
    if(S.signed[w]) S.signed[w]=null; else { const d=new Date(); S.signed[w]=d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear(); }
    save(); render();
  });
  if(tab==='ajustes'){
    const ny=M.querySelector('#ny'), nm=M.querySelector('#nm');
    ny.onchange=()=>{ S.names.yo=ny.value.trim()||'Yo'; save(); render(); };
    nm.onchange=()=>{ S.names.madre=nm.value.trim()||'Mamá'; save(); render(); };
    M.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ const [t,i]=b.dataset.p.split('|'); const o=S.plan[t][i]; S.plan[t][i]=OWN[(OWN.indexOf(o)+1)%OWN.length]; save(); render(); });
    M.querySelectorAll('[data-r2]').forEach(b=>b.onclick=()=>{ const [r,i]=b.dataset.r2.split('|'); S.rules[r][i]=S.rules[r][i]?0:1; save(); render(); });
    M.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ S.goal=+b.dataset.g; save(); render(); });
    M.querySelector('#bk').onclick=()=>{ const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
      const done=()=>toast('Código copiado. Guárdalo en tus notas');
      try{ navigator.clipboard.writeText(code).then(done,()=>{ const r=M.querySelector('#rs'); r.value=code; r.select(); toast('Copia el código del recuadro'); }); }catch(e){ const r=M.querySelector('#rs'); r.value=code; r.select(); toast('Copia el código del recuadro'); } };
    M.querySelector('#rsb').onclick=()=>{ const v=M.querySelector('#rs').value.trim(); if(!v) return;
      try{ const o=JSON.parse(decodeURIComponent(escape(atob(v)))); if(!o.plan||!o.done) throw 0;
        confirmSheet('Recuperar datos','Se cambian los datos de este móvil por los del código.','Recuperar',()=>{ S=o; for(const k in DEFAULT) if(S[k]===undefined) S[k]=JSON.parse(JSON.stringify(DEFAULT[k])); save(); render(); toast('Datos recuperados'); });
      }catch(e){ toast('Ese código no es válido'); } };
    M.querySelector('#reset').onclick=()=>confirmSheet('Borrar historial','Se borran las tareas marcadas y los premios.','Borrar',()=>{ S.done={}; S.weeks={}; S.signed={yo:null,madre:null}; save(); render(); toast('Historial borrado'); });
  }
}
render();
})();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
</body>
</html>
